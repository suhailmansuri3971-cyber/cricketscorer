<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#EEF2F8" />

<title>Cricket Scorer — Live Match Center</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{
  --bg-0:#EEF2F8; --bg-1:#F7F9FC;
  --surface:#FFFFFF; --surface-solid:#FFFFFF;
  --surface-2:#F3F5F9;
  --border: rgba(20,30,50,0.08); --border-strong: rgba(20,30,50,0.14);
  --gold:#F5A623; --gold-dim:#C9902A; --gold-soft: rgba(245,166,35,0.12);
  --grass:#22C55E; --sky:#3B82F6; --crimson:#EF4444;
  --cream:#1A2333; --muted:#8A94A6; --muted-2:#B2BAC7;
  --radius: 18px;
  --shadow-lift: 0 8px 28px rgba(30,41,59,0.08);
  /* 🖼️ STADIUM BACKGROUND PHOTO — replace this URL with your own image link */
  --stadium-bg: url('https://imglink.cc/cdn/iQnH4kc_m1.png');
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html{ -webkit-text-size-adjust:100%; }
html,body{margin:0;background:var(--bg-0); overscroll-behavior-y:contain;}
body{
  min-height:100vh; -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  background:
    radial-gradient(600px 400px at 12% -8%, rgba(59,130,246,0.07), transparent 60%),
    radial-gradient(600px 500px at 110% 0%, rgba(34,197,94,0.07), transparent 55%),
    var(--bg-0);
}
button, .btn, .chip, .ballbtn, .tabbtn{ touch-action:manipulation; user-select:none; -webkit-user-select:none; }
input, select{ touch-action:manipulation; }
.shell{
  max-width:480px; margin:0 auto; min-height:100vh; position:relative;
  color:var(--cream); font-family:'Inter',-apple-system,sans-serif;
  padding:14px 14px 96px; overflow-x:hidden;
}
.shell::before{ content:none; }
.shell > *{ position:relative; z-index:1; }

.stadiumHeader{
  margin:-14px -14px 0; padding:calc(env(safe-area-inset-top) + 14px) 16px 46px;
  position:relative; overflow:hidden; border-radius:0 0 32px 32px;
  background-image:
    linear-gradient(180deg, rgba(255,255,255,0.06) 0%, rgba(255,255,255,0.1) 50%, var(--bg-0) 100%),
    var(--stadium-bg);
  background-size:cover; background-position:center 30%;
  box-shadow:0 10px 30px rgba(30,60,90,0.12);
}
.stadiumHeader .headerRow{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
.iconBtn{
  width:40px; height:40px; border-radius:50%; background:rgba(255,255,255,0.92);
  border:none; display:flex; align-items:center; justify-content:center; font-size:17px;
  box-shadow:0 4px 12px rgba(20,30,50,0.15); color:var(--cream); cursor:pointer; flex:none;
  backdrop-filter:blur(6px); transition:transform .1s;
}
.iconBtn:active{ transform:scale(0.9); }
.heroLiveRow{ text-align:center; }
.heroLiveRow .livePill{ box-shadow:0 4px 12px rgba(239,68,68,0.35); }
.heroMatchTitle{ text-align:center; font-family:'Inter',sans-serif; font-size:22px; font-weight:800; color:#0F1A2B; margin-top:8px; text-shadow:0 1px 2px rgba(255,255,255,0.4); }
.heroMatchSub{ text-align:center; font-size:12px; color:rgba(15,26,43,0.6); font-weight:600; letter-spacing:0.4px; margin-top:2px; }
.stadiumHeader.managerHeader{ padding-bottom:40px; }
.managerHeaderRow{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
.managerHeaderRow .heroMatchTitle{ text-align:left; font-size:19px; margin-top:0; }
.managerHeaderRow .heroMatchSub{ text-align:left; margin-top:1px; }

.scorecard.overlapUp, .card.overlapUp, .stickyTop.overlapUp{ margin-top:-32px; }
@keyframes fadeSlideIn{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }
.tabContent{ animation:fadeSlideIn .2s ease; }

h1,h2,h3{ font-family:'Teko',sans-serif; margin:2px 0 8px; letter-spacing:0.3px; font-weight:600; }
h1{ font-size:38px; } h2{ font-size:28px; } h3{ font-size:22px; text-transform:uppercase; letter-spacing:0.6px; color:var(--cream); }

.eyebrow{ font-family:'Teko',sans-serif; font-size:14px; letter-spacing:4px; color:var(--gold-dim); font-weight:600; margin-bottom:2px; text-transform:uppercase; }
.hint{ color:var(--muted); font-size:13px; margin:2px 0 10px; line-height:1.5; }

.card{
  background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
  padding:18px; margin-bottom:14px;
  box-shadow: var(--shadow-lift);
}
.center{ text-align:center; }
.linklike{ color:var(--sky); font-weight:700; text-decoration:none; font-size:14px; }

.lbl{ display:block; font-size:11px; letter-spacing:1.2px; text-transform:uppercase; color:var(--muted); margin:12px 0 6px; font-weight:700; }
.input,.select{
  width:100%; padding:13px 14px; border-radius:12px; border:1px solid var(--border-strong);
  background:#FBFCFE; color:var(--cream); font-size:15px; margin-bottom:6px;
  font-family:'Inter',sans-serif; appearance:none;
}
.input:focus,.select:focus{ outline:none; border-color:var(--sky); box-shadow:0 0 0 3px rgba(59,130,246,0.15); }
.select{ background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='9'><path d='M1 1l6 6 6-6' stroke='%238A94A6' stroke-width='2' fill='none' fill-rule='evenodd'/></svg>"); background-repeat:no-repeat; background-position:right 14px center; padding-right:34px; }
.codeInput{ text-align:center; font-family:'Orbitron',sans-serif; font-size:24px; letter-spacing:6px; font-weight:700; text-transform:uppercase; }

.rowbtns{ display:flex; gap:8px; flex-wrap:wrap; }
.chip{
  flex:1; min-width:70px; padding:11px 8px; border-radius:11px; border:1px solid var(--border-strong);
  background:#FBFCFE; color:var(--cream); font-weight:700; font-size:14px; transition:.15s;
}
.chip.small{ flex:none; min-width:44px; }
.chipActive{ background:var(--gold); color:#fff; border-color:var(--gold); box-shadow:0 4px 14px rgba(245,166,35,0.3); }

.btn{ padding:13px 18px; border-radius:13px; border:none; font-weight:800; font-size:15px; cursor:pointer; font-family:'Inter',sans-serif; transition:transform .08s ease, opacity .15s, box-shadow .08s; letter-spacing:0.2px; }
.btn:active{ transform:scale(0.96); }
.btn.primary{ background:linear-gradient(180deg,#4C9EF0,var(--sky)); color:#fff; box-shadow:0 8px 22px rgba(59,130,246,0.28); }
.btn.danger{ background:linear-gradient(180deg,#F87171,var(--crimson)); color:#fff; box-shadow:0 8px 22px rgba(239,68,68,0.22); }
.btn.ghost{ background:#fff; color:var(--cream); border:1px solid var(--border-strong); box-shadow:0 1px 3px rgba(20,30,50,0.04); }
.btn.small{ padding:9px 13px; font-size:12.5px; border-radius:20px; }
.btn.big{ width:100%; padding:17px; font-size:17px; margin-top:8px; }
.btn:disabled{ opacity:0.35; cursor:not-allowed; }

.topbar{ display:flex; justify-content:space-between; align-items:center; padding:10px 2px 14px; position:sticky; top:0; z-index:20; background:linear-gradient(var(--bg-0) 75%, transparent); backdrop-filter:blur(6px); }
.matchName{ font-family:'Teko',sans-serif; font-size:20px; font-weight:600; letter-spacing:0.3px; color:var(--cream); }
.code{ font-size:11px; color:var(--muted); letter-spacing:0.5px; }
.liveDot{ display:inline-block; width:7px; height:7px; border-radius:50%; background:var(--crimson); margin-right:6px; box-shadow:0 0 8px rgba(239,68,68,0.6); animation:pulse 1.4s ease-in-out infinite; }
@keyframes pulse{ 0%,100%{opacity:1;} 50%{opacity:0.35;} }
.livePill{ display:inline-flex; align-items:center; gap:5px; background:var(--crimson); color:#fff; font-size:11px; font-weight:800; letter-spacing:1px; padding:4px 12px; border-radius:20px; text-transform:uppercase; }
.livePill .liveDot{ background:#fff; box-shadow:none; }
.pill{ display:inline-block; font-size:11px; font-weight:700; padding:3px 10px; border-radius:20px; vertical-align:middle; margin-left:6px; }
.pillGreen{ background:rgba(34,197,94,0.14); color:#16803C; }

.stickyTop{ position:sticky; top:calc(env(safe-area-inset-top) + 8px); z-index:15; }

.scorecard{
  position:relative; border-radius:20px; padding:20px 18px; text-align:center; margin-bottom:12px;
  background: #FFFFFF;
  border:1px solid var(--border);
  box-shadow: var(--shadow-lift);
  overflow:hidden;
}
.scorecard::before{ content:none; }
.teamRow{ display:flex; justify-content:space-between; align-items:center; font-size:12px; color:var(--muted); margin-bottom:6px; position:relative; text-transform:uppercase; letter-spacing:0.6px; }
.teamRow .teamName{ font-family:'Inter',sans-serif; font-size:17px; font-weight:700; color:var(--cream); text-transform:none; letter-spacing:0.1px; }
.overs{ font-variant-numeric:tabular-nums; }
.ledscore{
  font-family:'Inter',sans-serif; font-size:52px; font-weight:800; color:var(--cream);
  font-variant-numeric:tabular-nums; line-height:1; position:relative; margin:6px 0;
}
.bigscore{ font-family:'Inter',sans-serif; font-size:40px; color:var(--cream); font-weight:800; margin:8px 0; }
.bigscore.small,.ledscore.small{ font-size:28px; }
.slash{ color:var(--muted-2); font-size:0.6em; margin:0 6px; }
.target{ color:var(--muted); font-weight:600; margin-top:6px; font-size:13px; }
.batsmen{ display:flex; justify-content:space-between; margin-top:8px; font-size:14.5px; padding-top:8px; border-top:1px solid var(--border); }
.batsmen:first-of-type{ border-top:1px dashed var(--border-strong); padding-top:10px; margin-top:10px; }
.batName{ color:var(--cream); font-weight:700; }
.batScore{ color:var(--cream); font-weight:700; font-variant-numeric:tabular-nums; }
.muted2{ color:var(--muted) !important; font-weight:500 !important; }

.keypad{ background:transparent; border:none; border-radius:20px; padding:0; margin-bottom:10px; }
.grid6{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:10px; }
.ballbtn{ padding:22px 0; font-size:26px; font-family:'Inter',sans-serif; font-weight:800; border-radius:16px; border:1px solid var(--border-strong); background:#fff; color:var(--cream); transition:transform .09s ease, box-shadow .09s; box-shadow:0 2px 8px rgba(20,30,50,0.05); }
.ballbtn:active{ transform:scale(0.91); box-shadow:0 1px 3px rgba(20,30,50,0.08); }
.ballbtn.four{ background:linear-gradient(160deg,#5FA8F5,var(--sky)); color:#fff; border-color:transparent; box-shadow:0 6px 16px rgba(59,130,246,0.3); }
.ballbtn.six{ background:linear-gradient(160deg,#3DDC79,var(--grass)); color:#fff; border-color:transparent; box-shadow:0 6px 16px rgba(34,197,94,0.3); }
.extrasRow{ margin-bottom:6px; }
.grid4{ display:grid; grid-template-columns:repeat(4,1fr); gap:8px; }
.submenu{ background:#F7F9FC; border:1px solid var(--border); border-radius:12px; padding:11px; margin-top:8px; }
.bigActionsRow{ margin-top:14px; }
.bigActionsRow .btn{ flex:1; padding:17px 0; font-size:16px; }
.freehit{ background:linear-gradient(180deg,#FFD873,var(--gold)); color:#3B2600; font-weight:800; text-align:center; padding:10px; border-radius:12px; margin-bottom:10px; letter-spacing:0.3px; animation:pulse 1.6s ease-in-out infinite; }

.collapseBtn{ width:100%; background:none; border:none; color:var(--muted); font-weight:700; padding:12px 0; font-size:13px; letter-spacing:0.5px; cursor:pointer; }
.players{ display:flex; flex-direction:column; gap:6px; }
.playerRow{ font-size:14px; padding:10px 12px; border-radius:10px; background:#F7F9FC; color:var(--cream); border:1px solid transparent; display:flex; justify-content:space-between; align-items:center; gap:8px; }
.playerRow.batting{ font-weight:700; border-color:rgba(34,197,94,0.35); background:rgba(34,197,94,0.07); }
.playerRow.out{ opacity:0.75; }
.playerRow .pname{ flex:1; }
.playerRow .pscore{ font-weight:700; font-variant-numeric:tabular-nums; color:var(--cream); white-space:nowrap; }
.dismissText{ color:var(--crimson); font-size:12.5px; font-weight:600; }
.playerEditRow{ display:flex; justify-content:space-between; align-items:center; padding:6px 2px; font-size:14.5px; border-bottom:1px solid var(--border); }
.xbtn{ background:none; border:none; color:var(--crimson); font-weight:700; font-size:16px; cursor:pointer; padding:4px 8px; }

.feed{ max-height:150px; overflow-y:auto; margin-bottom:4px; }
.feed.tall{ max-height:none; }
.feedRow{ padding:8px 2px; border-bottom:1px solid var(--border); font-size:14px; color:var(--cream); display:flex; align-items:center; gap:10px; }
.feedRow:first-child{ font-weight:700; }
.feedIcon{ display:inline-flex; align-items:center; justify-content:center; width:24px; height:24px; border-radius:50%; font-size:12px; font-weight:800; color:#fff; flex:none; }
.feedTime{ color:var(--muted); font-size:12px; min-width:32px; }

.summaryGrid{ display:flex; justify-content:space-around; margin:18px 0; }
.warn{ color:var(--crimson); font-size:12px; margin-top:4px; }

.modalBg{ position:fixed; inset:0; background:rgba(20,30,50,0.35); backdrop-filter:blur(3px); display:flex; align-items:flex-end; z-index:80; }
.modal{ background:var(--surface-solid); width:100%; max-width:480px; margin:0 auto; border-radius:22px 22px 0 0; padding:20px; max-height:86vh; overflow-y:auto; border:1px solid var(--border-strong); border-bottom:none; animation:slideUp .22s ease-out; box-shadow:0 -10px 40px rgba(20,30,50,0.15); }
@keyframes slideUp{ from{ transform:translateY(30px); opacity:0.4; } to{ transform:translateY(0); opacity:1; } }

.overlayLayer{ position:fixed; inset:0; pointer-events:none; z-index:70; display:flex; align-items:center; justify-content:center; perspective:700px; }
.toastBanner{ position:fixed; top:20px; left:50%; transform:translateX(-50%); background:linear-gradient(180deg,#FFD873,var(--gold)); color:#3B2600; font-weight:800; padding:11px 20px; border-radius:30px; z-index:70; animation:slideDown 1.5s ease forwards; box-shadow:0 10px 26px rgba(245,166,35,0.3); font-size:14px; }
@keyframes slideDown{ 0%{opacity:0; transform:translate(-50%,-30px);} 15%{opacity:1; transform:translate(-50%,0);} 80%{opacity:1;} 100%{opacity:0;} }

.eventText3d{ font-family:'Teko',sans-serif; font-weight:700; font-size:64px; letter-spacing:1px; animation:pop3d 1.4s cubic-bezier(.17,.89,.32,1.28) forwards; transform-style:preserve-3d; }
.text-six{ color:var(--grass); text-shadow:0 4px 22px rgba(34,197,94,0.45), 0 2px 8px rgba(20,30,50,0.2); }
.text-four{ color:var(--sky); text-shadow:0 4px 22px rgba(59,130,246,0.45), 0 2px 8px rgba(20,30,50,0.2); }
.text-out{ color:var(--crimson); text-shadow:0 4px 22px rgba(239,68,68,0.45), 0 2px 8px rgba(20,30,50,0.2); }
@keyframes pop3d{ 0%{transform:perspective(600px) rotateX(90deg) scale(0.4); opacity:0;} 30%{transform:perspective(600px) rotateX(-15deg) scale(1.2); opacity:1;} 50%{transform:perspective(600px) rotateX(0deg) scale(1);} 85%{opacity:1;} 100%{opacity:0; transform:perspective(600px) scale(1.05);} }

.flyball{ position:absolute; font-size:46px; left:20%; bottom:35%; animation:flyUp 1.1s ease-out forwards; filter:drop-shadow(0 6px 14px rgba(20,30,50,.25)); }
@keyframes flyUp{ 0%{transform:translate3d(0,0,0) rotate(0deg) scale(0.6); opacity:0;} 20%{opacity:1;} 100%{transform:translate3d(180px,-240px,0) rotate(900deg) scale(1.3); opacity:0;} }
.zoomball{ position:absolute; font-size:42px; left:10%; bottom:40%; animation:zoomAcross 0.9s ease-out forwards; }
@keyframes zoomAcross{ 0%{transform:translateX(-30px) rotate(0deg) scale(0.7); opacity:0;} 15%{opacity:1;} 100%{transform:translateX(240px) rotate(540deg) scale(1.1); opacity:0;} }
.bail{ position:absolute; font-size:42px; top:40%; animation:bailFall 0.9s ease-in forwards; }
@keyframes bailFall{ 0%{transform:translateY(-20px) rotate(0deg); opacity:0;} 20%{opacity:1;} 100%{transform:translateY(70px) rotate(220deg); opacity:0;} }
.shakeScreen{ animation:shake 0.5s; }
@keyframes shake{ 10%,90%{transform:translateX(-2px);} 20%,80%{transform:translateX(4px);} 30%,50%,70%{transform:translateX(-8px);} 40%,60%{transform:translateX(8px);} }
.confettiWrap{ position:fixed; inset:0; pointer-events:none; overflow:hidden; z-index:65; }
.confetti{ position:absolute; top:0; width:8px; height:14px; border-radius:2px; animation-name:confettiFall; animation-timing-function:ease-in; }
@keyframes confettiFall{ 0%{transform:translateY(-20px) rotate(0deg); opacity:1;} 100%{transform:translateY(480px) rotate(720deg); opacity:0;} }

.heroWrap{ min-height:92vh; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:20px 6px; }
.heroStadiumBg{
  margin:-14px -14px 0; height:300px; position:relative; overflow:hidden; border-radius:0 0 32px 32px;
  background-image:
    linear-gradient(180deg, rgba(255,255,255,0) 40%, rgba(238,242,248,0.5) 78%, var(--bg-0) 100%),
    var(--stadium-bg);
  background-size:cover; background-position:center 32%;
}
.heroTop{ margin-bottom:30px; }
.heroBall{ font-size:56px; margin-bottom:10px; animation:floatBall 2.6s ease-in-out infinite; filter:drop-shadow(0 10px 20px rgba(245,166,35,0.25)); }
@keyframes floatBall{ 0%,100%{transform:translateY(0) rotate(0deg);} 50%{transform:translateY(-12px) rotate(12deg);} }
.heroTitle{ font-size:42px; margin:2px 0; color:var(--cream); }
.heroSub{ color:var(--muted); font-size:14px; margin:0; max-width:280px; }
.heroCard{ background:var(--surface); border:1px solid var(--border-strong); border-radius:22px; padding:24px; width:100%; max-width:340px; margin-top:26px; box-shadow:var(--shadow-lift); }
.heroInput{ font-size:28px; padding:17px; margin:8px 0 12px; }
.adminLink{ margin-top:30px; color:var(--muted); font-size:12.5px; text-decoration:none; padding:9px 16px; border:1px solid var(--border-strong); border-radius:22px; letter-spacing:0.3px; }
.adminLink:active{ background:var(--surface-2); }

.errorBanner{ background:linear-gradient(180deg,#F87171,var(--crimson)); color:#fff; font-size:13px; font-weight:700; padding:11px 14px; border-radius:12px; margin-bottom:10px; }

.tabbar{
  position:fixed; bottom:0; left:0; right:0; z-index:60;
  display:flex; justify-content:space-around; align-items:center;
  max-width:480px; margin:0 auto; background:#fff; border-top:1px solid var(--border);
  padding:8px 4px calc(8px + env(safe-area-inset-bottom));
  box-shadow:0 -4px 20px rgba(20,30,50,0.06);
}
.tabbtn{ background:none; border:none; display:flex; flex-direction:column; align-items:center; gap:3px; color:var(--muted); font-size:11px; font-weight:600; padding:6px 14px; cursor:pointer; font-family:'Inter',sans-serif; transition:color .15s, transform .1s; border-radius:12px; }
.tabbtn:active{ transform:scale(0.92); background:var(--surface-2); }
.tabbtn span:first-child{ font-size:19px; line-height:1; transition:transform .15s; }
.tabbtn.tabActive{ color:var(--grass); }
.tabbtn.tabActive span:first-child{ transform:translateY(-1px) scale(1.08); }

@media print{
  .noprint,.keypad,.collapseBtn,.tabbar{ display:none; }
  .shell{ background:#fff; color:#000; padding-bottom:20px; }
  .scorecard,.card{ border-color:#000; }
}

    strikerId: null, nonStrikerId: null, freeHit: false, events: [], lastEvent: null,
  };
}
function normalizeMatch(m) {
  // Firebase Realtime Database silently drops empty arrays (treats [] like null,
  // removing the key). So after loading a match back, inn.events can be
  // `undefined` instead of `[]`, which crashes the very first inn.events.push().
  // Patch it back to an array on every load, for both innings.
  if (!m) return m;
  if (m.innings1 && !m.innings1.events) m.innings1.events = [];
  if (m.innings2 && !m.innings2.events) m.innings2.events = [];
  return m;
}
function totalPlayers(match, teamKey) { return match.config[teamKey].players.length; }
function swapStrike(inn) { const t = inn.strikerId; inn.strikerId = inn.nonStrikerId; inn.nonStrikerId = t; }
function creditBatsman(match, teamKey, playerId, runs, ballFaced) {
  const p = match.config[teamKey].players.find((pl) => pl.id === playerId);
  if (!p) return;
  if (!p.runs) p.runs = 0;
  if (!p.balls) p.balls = 0;
  p.runs += runs;
  if (ballFaced) p.balls += 1;
}

/* ============ Sound: short tones + spoken word, no audio files needed ============ */
let __audioCtx = null;
function playEventSound(kind) {
  if (kind !== "six" && kind !== "four" && kind !== "out") return;
  try {
    if (navigator.vibrate) {
      if (kind === "six") navigator.vibrate([40, 30, 40, 30, 80]);
      else if (kind === "four") navigator.vibrate([40, 30, 60]);
      else if (kind === "out") navigator.vibrate([90, 40, 90]);
    }
  } catch (e) {}
  try {
    __audioCtx = __audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    if (__audioCtx.state === "suspended") __audioCtx.resume();
    const beep = (freq, dur, delay, type) => {
      setTimeout(() => {
        const o = __audioCtx.createOscillator();
        const g = __audioCtx.createGain();
        o.type = type || "sine";
        o.frequency.value = freq;
        o.connect(g); g.connect(__audioCtx.destination);
        g.gain.setValueAtTime(0.22, __audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, __audioCtx.currentTime + dur);
        o.start(); o.stop(__audioCtx.currentTime + dur);
      }, delay);
    };
    let word = "";
    if (kind === "six") { beep(523, 0.15, 0); beep(659, 0.15, 120); beep(784, 0.28, 240); word = "Six!"; }
    else if (kind === "four") { beep(587, 0.16, 0); beep(784, 0.26, 130); word = "Four!"; }
    else if (kind === "out") { beep(220, 0.32, 0, "sawtooth"); beep(160, 0.36, 190, "sawtooth"); word = "Owwt!"; }
    if (window.speechSynthesis && word) {
      const u = new SpeechSynthesisUtterance(word);
      u.rate = 1.05; u.pitch = kind === "out" ? 0.8 : 1.15; u.volume = 1;
      setTimeout(() => { try { speechSynthesis.cancel(); speechSynthesis.speak(u); } catch (e) {} }, 260);
    }
  } catch (e) { /* audio not available — fail silently */ }
}

function generateMatchPDF(m) {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  const line = (txt, size, bold, gap) => {
    doc.setFontSize(size || 11);
    doc.setFont(undefined, bold ? "bold" : "normal");
    doc.text(String(txt), 14, y);
    y += gap || 7;
  };
  let y = 18;
  line(m.config.matchName || "Cricket Match", 18, true, 10);
  line(`${m.config.teamA.name} vs ${m.config.teamB.name}`, 13, true, 8);
  line(`Toss: ${m.config[m.config.toss.winner === "A" ? "teamA" : "teamB"].name} won, chose ${m.config.toss.decision}`, 10, false, 6);
  line(`Overs: ${m.config.overs}   Result: ${m.result || "-"}`, 10, false, 10);

  [["innings1", m.battingKey], ["innings2", m.bowlingKey]].forEach(([key, teamKey]) => {
    const inn = m[key];
    if (!inn) return;
    line(`${m.config[teamKey].name} — ${inn.runs}/${inn.wickets} (${fmtOvers(inn.balls)} overs)`, 13, true, 7);
    line(`Extras — wide ${inn.extras.wide}, no-ball ${inn.extras.noball}, bye ${inn.extras.bye}, leg-bye ${inn.extras.legbye}`, 9, false, 7);
    m.config[teamKey].players.forEach((p) => {
      const status = p.out ? `out (${p.dismissal})` : "not out";
      line(`  ${p.name} — ${p.runs || 0} (${p.balls || 0} balls) — ${status}`, 10, false, 6);
    });
    y += 4;
  });

  doc.save(`${(m.config.matchName || "match").replace(/[^a-z0-9]+/gi, "_")}.pdf`);
}

function applyDelivery(match, inn, teamKey, { kind, runs }) {
  let legalBall = true;
  let strikeSwapRuns = 0;
  let label = "";
  const strikerId = inn.strikerId;

  if (kind === "normal") {
    inn.runs += runs;
    strikeSwapRuns = runs;
    label = runs === 6 ? "SIX!" : runs === 4 ? "FOUR!" : runs === 0 ? "Dot ball" : `${runs} run${runs === 1 ? "" : "s"}`;
    creditBatsman(match, teamKey, strikerId, runs, true);
  } else if (kind === "bye") {
    inn.runs += runs;
    inn.extras.bye += runs;
    strikeSwapRuns = runs;
    label = `${runs} bye${runs === 1 ? "" : "s"}`;
    creditBatsman(match, teamKey, strikerId, 0, true);
  } else if (kind === "legbye") {
    inn.runs += runs;
    inn.extras.legbye += runs;
    strikeSwapRuns = runs;
    label = `${runs} leg bye${runs === 1 ? "" : "s"}`;
    creditBatsman(match, teamKey, strikerId, 0, true);
  } else if (kind === "wide") {
    legalBall = false;
    inn.runs += 1 + runs;
    inn.extras.wide += 1 + runs;
    strikeSwapRuns = runs;
    label = runs > 0 ? `Wide +${runs}` : "Wide";
  } else if (kind === "noball") {
    legalBall = false;
    inn.runs += 1 + runs;
    inn.extras.noball += 1;
    strikeSwapRuns = runs;
    label = runs > 0 ? `No ball +${runs}` : "No ball";
    creditBatsman(match, teamKey, strikerId, runs, true);
  }

  if (legalBall) inn.balls += 1;

  if (kind === "noball") inn.freeHit = true;
  else if (kind !== "wide") inn.freeHit = false;

  if (strikeSwapRuns % 2 === 1) swapStrike(inn);
  if (legalBall && inn.balls > 0 && inn.balls % 6 === 0) swapStrike(inn);

  inn.lastEvent = { id: uid(), label, kind: runs === 6 ? "six" : runs === 4 ? "four" : kind === "normal" ? "normal" : kind };
  if (!inn.events) inn.events = [];
  inn.events.push(inn.lastEvent);
  return inn;
}

function applyWicket(match, inn, teamKey, { runsBeforeOut, dismissedSlot, howOut, newBatsmanId }) {
  inn.runs += runsBeforeOut;
  inn.balls += 1;
  inn.wickets += 1;
  inn.freeHit = false;
  creditBatsman(match, teamKey, inn.strikerId, runsBeforeOut, true);

  const outPlayerId = dismissedSlot === "striker" ? inn.strikerId : inn.nonStrikerId;
  const team = match.config[teamKey].players;
  const p = team.find((pl) => pl.id === outPlayerId);
  if (p) { p.out = true; p.dismissal = howOut; }

  if (dismissedSlot === "striker") inn.strikerId = newBatsmanId;
  else inn.nonStrikerId = newBatsmanId;

  if (runsBeforeOut % 2 === 1) swapStrike(inn);
  if (inn.balls > 0 && inn.balls % 6 === 0) swapStrike(inn);

  inn.lastEvent = { id: uid(), label: `OUT (${howOut})`, kind: "out" };
  if (!inn.events) inn.events = [];
  inn.events.push(inn.lastEvent);
  return inn;
}

function inningsShouldEnd(match, inn, teamKey) {
  if (inn.wickets >= totalPlayers(match, teamKey) - 1) return "all_out";
  if (inn.balls >= match.config.overs * 6) return "overs_done";
  if (match.currentInnings === 2 && inn.runs >= match.target) return "target_reached";
  return null;
}

function computeResult(m) {
  const chased = m.innings2.runs;
  const target = m.target;
  const battingTeam2Key = m.bowlingKey;
  const wicketsLeft = totalPlayers(m, battingTeam2Key) - 1 - m.innings2.wickets;
  if (chased >= target) {
    return `${m.config[battingTeam2Key].name} jeet gayi, ${wicketsLeft} wicket${wicketsLeft === 1 ? "" : "s"} se.`;
  } else if (chased === target - 1) {
    return "Match TIE ho gaya!";
  } else {
    const margin = target - 1 - chased;
    return `${m.config[m.battingKey].name} jeet gayi, ${margin} run${margin === 1 ? "" : "s"} se.`;
  }
}

      innings1: newInnings(battingKey, bowlingKey, overs),
      innings2: null,
      target: null,
      result: null,
    };
    state.busy = true;
    const btn = document.getElementById("goLiveBtn");
    btn.disabled = true; btn.textContent = "Starting...";
    try {
      await set(ref(db, matchPath(code)), m);
      await set(ref(db, adminPath(adminCode)), code);
      alert(
        "Match live ho gaya!\n\nYE TUMHARA ADMIN CODE HAI (isse tum kabhi bhi wapas is match par aa sakte ho, chahe tab band ho jaye):\n\n" +
        adminCode +
        "\n\nIse kahi safe jagah likh lo — screenshot le lo abhi!"
      );
      location.hash = `#/manage/${adminCode}`;
    } catch (e) {
      alert("Firebase se connect nahi ho paaya. Config check karo. (" + e.message + ")");
      btn.disabled = false; btn.textContent = "Go Live 🔴";
    }
    state.busy = false;
  };

  $app().innerHTML = `
    <div class="header" style="padding:10px 2px 16px;">
      <div class="eyebrow">Gully Cricket</div>
      <h1>Cricket Scorer</h1>
    </div>
    <div class="card">
      <label class="lbl">Team A naam</label>
      <input class="input" placeholder="Team A" oninput="window.__teamAName=this.value;" onchange="window.__teamAName=this.value;" />
      <label class="lbl">Team A players</label>
      <div id="rosterA"></div>
      <div class="rowbtns" style="margin-top:6px;">
        <input id="newPlayerA" class="input" placeholder="Player naam" style="margin-bottom:0;" onkeydown="if(event.key==='Enter')window.__addPlayer('A')" />
        <button class="btn ghost" onclick="window.__addPlayer('A')">+ Add</button>
      </div>
    </div>
    <div class="card">
      <label class="lbl">Team B naam</label>
      <input class="input" placeholder="Team B" oninput="window.__teamBName=this.value;" onchange="window.__teamBName=this.value;" />
      <label class="lbl">Team B players</label>
      <div id="rosterB"></div>
      <div class="rowbtns" style="margin-top:6px;">
        <input id="newPlayerB" class="input" placeholder="Player naam" style="margin-bottom:0;" onkeydown="if(event.key==='Enter')window.__addPlayer('B')" />
        <button class="btn ghost" onclick="window.__addPlayer('B')">+ Add</button>
      </div>
    </div>
    <div class="card">
      <label class="lbl">Overs</label>
      <input class="input" type="number" min="1" value="6" oninput="window.__overs=this.value;" />
      <label class="lbl">Toss jeeta</label>
      <div class="rowbtns">
        <button id="tossA" class="chip chipActive" onclick="window.__setToss('A')">Team A</button>
        <button id="tossB" class="chip" onclick="window.__setToss('B')">Team B</button>
      </div>
      <label class="lbl">Decision</label>
      <div class="rowbtns">
        <button id="decBat" class="chip chipActive" onclick="window.__setDecision('bat')">Batting</button>
        <button id="decBowl" class="chip" onclick="window.__setDecision('bowl')">Bowling</button>
      </div>
    </div>
    <button id="goLiveBtn" class="btn primary big" onclick="window.__goLive()">Go Live 🔴</button>
    <div class="center" style="margin-top:14px;">
      <a class="linklike" href="#/watch">Match dekhna hai? Yaha code dalo →</a>
    </div>`;

  // wire simple field trackers without full re-render (avoids cursor loss)
  Object.defineProperty(window, "__teamAName", { configurable: true, set(v) { state.teamAName = v; }, get() { return state.teamAName; } });
  Object.defineProperty(window, "__teamBName", { configurable: true, set(v) { state.teamBName = v; }, get() { return state.teamBName; } });
  Object.defineProperty(window, "__overs", { configurable: true, set(v) { state.overs = v; }, get() { return state.overs; } });
  renderRoster("A"); renderRoster("B");
}

/* ============ Manager view (live scoring) ============ */
function mountManager(adminCode) {
  let realCode; // undefined = loading, null = not found
  let match = null;
  let saveError = null;
  let history = [];
  let flash = null, flashTimer = null, lastEventId = null;
  let showPlayers = false, extraMenu = null, activeTab = "score";
  let outOpen = false, outRuns = 0, outSlot = "striker", outHow = "bowled", newBatId = "";

  function render() { renderManagerBody({ realCode, match, saveError, history, flash, showPlayers, extraMenu, activeTab, outOpen, outRuns, outSlot, outHow, newBatId, adminCode }); }

  function pushState(m) {
    history = [...history.slice(-25), match];
    setLocal(m);
    set(ref(db, matchPath(realCode)), m).catch((e) => {
      saveError = "Save fail hua (" + e.message + "). Database Rules check karo.";
      render();
    });
  }
  function setLocal(m) {
    match = normalizeMatch(m);
    saveError = null;
    const inn = m.currentInnings === 1 ? m.innings1 : m.innings2;
    if (inn?.lastEvent && inn.lastEvent.id !== lastEventId) {
      lastEventId = inn.lastEvent.id;
      flash = inn.lastEvent;
      playEventSound(inn.lastEvent.kind);
      render();
      clearTimeout(flashTimer);
      flashTimer = setTimeout(() => { flash = null; render(); }, 1500);
      return;
    }
    render();
  }

  window.__undo = () => {
    const prev = history.pop();
    if (prev) {
      match = prev;
      saveError = null;
      render();
      set(ref(db, matchPath(realCode)), prev).catch((e) => { saveError = "Save fail hua (" + e.message + ")."; render(); });
    }
  };

  function currentInnKey() { return match.currentInnings === 1 ? "innings1" : "innings2"; }
  function currentTeamKey() { return match.currentInnings === 1 ? match.battingKey : match.bowlingKey; }

  function finalize(m, key, teamKey) {
    const endReason = inningsShouldEnd(m, m[key], teamKey);
    if (endReason) {
      if (m.currentInnings === 1) { m.target = m[key].runs + 1; m.status = "inningsBreak"; }
      else { m.status = "completed"; m.result = computeResult(m); }
    }
    pushState(m);
  }

  window.__doDelivery = (kind, runs) => {
    if (navigator.vibrate) try { navigator.vibrate(12); } catch (e) {}
    const m = clone(match);
    const key = m.currentInnings === 1 ? "innings1" : "innings2";
    const teamKey = m.currentInnings === 1 ? m.battingKey : m.bowlingKey;
    applyDelivery(m, m[key], teamKey, { kind, runs: Number(runs) });
    finalize(m, key, teamKey);
  };
  window.__toggleExtra = (kind) => { extraMenu = extraMenu === kind ? null : kind; render(); };
  window.__doExtra = (kind, runs) => { window.__doDelivery(kind, runs); extraMenu = null; render(); };
  window.__setTab = (t) => { activeTab = t; render(); };
  window.__addLivePlayer = (teamKey) => {
    const input = document.getElementById(`liveAddPlayer_${teamKey}`);
    const name = input?.value.trim();
    if (!name) return;
    const m = clone(match);
    m.config[teamKey].players.push({ id: uid(), name, out: false, dismissal: null, runs: 0, balls: 0 });
    pushState(m);
  };

  window.__openOut = () => {
    const inn = match[currentInnKey()];
    outRuns = 0; outSlot = "striker"; outHow = inn.freeHit ? "run out" : "bowled"; newBatId = "";
    outOpen = true; render();
  };
  window.__closeOut = () => { outOpen = false; render(); };
  window.__setOutSlot = (s) => { outSlot = s; render(); };
  window.__setOutHow = (v) => { outHow = v; };
  window.__setOutRuns = (r) => { outRuns = r; render(); };
  window.__setNewBat = (v) => { newBatId = v; render(); };
  window.__submitOut = () => {
    const key = currentInnKey();
    const teamKey = currentTeamKey();
    const inn = match[key];
    const howSel = document.getElementById("outHowSelect");
    if (howSel) outHow = howSel.value;
    const batSel = document.getElementById("newBatSelect");
    if (batSel) newBatId = batSel.value;
    if (inn.freeHit && outHow !== "run out") { alert("Free hit par sirf run out allowed hai."); return; }
    let newName = "";
    if (newBatId === "__new__") {
      const nameInput = document.getElementById("newBatNameInput");
      newName = nameInput?.value.trim() || "";
      if (!newName) { alert("Naye batsman ka naam likho."); return; }
    } else if (!newBatId) {
      alert("Naya batsman chuno.");
      return;
    }
    const m = clone(match);
    let newBatsmanId = newBatId;
    if (newBatId === "__new__") {
      const newPlayer = { id: uid(), name: newName, out: false, dismissal: null, runs: 0, balls: 0 };
      m.config[teamKey].players.push(newPlayer);
      newBatsmanId = newPlayer.id;
    }
    applyWicket(m, m[key], teamKey, { runsBeforeOut: Number(outRuns), dismissedSlot: outSlot, howOut: outHow, newBatsmanId });
    outOpen = false;
    finalize(m, key, teamKey);
  };

  window.__startSecondInnings = () => {
    const m = clone(match);
    m.currentInnings = 2;
    m.innings2 = newInnings(m.bowlingKey, m.battingKey, m.config.overs);
    m.status = "openers2";
    pushState(m);
  };
  window.__confirmOpeners = () => {
    const s = document.getElementById("openerS")?.value;
    const ns = document.getElementById("openerNS")?.value;
    if (!s || !ns || s === ns) return;
    const m = clone(match);
    const inn = m.currentInnings === 1 ? m.innings1 : m.innings2;
    inn.strikerId = s; inn.nonStrikerId = ns;
    m.status = "live";
    pushState(m);
  };

  window.__shareMatch = () => {
    const url = `${location.origin}${location.pathname}#/watch/${realCode}`;
    const text = `🏏 Cricket Scorer LIVE! Code: ${realCode}\nDekho: ${url}`;
    if (navigator.share) navigator.share({ text, url });
    else { navigator.clipboard?.writeText(text); alert("Link copy ho gaya:\n" + text); }
  };
  window.__shareAdminLink = () => {
    const url = `${location.origin}${location.pathname}#/manage/${adminCode}`;
    navigator.clipboard?.writeText(url);
    alert("Apna Admin link copy ho gaya — isse tum kabhi bhi wapas isi match par aa sakte ho (khud ke paas rakho, kisi aur ko mat do):\n" + url);
  };
  window.__downloadPDF = () => { try { generateMatchPDF(match); } catch (e) { alert("PDF nahi ban paya: " + e.message); } };
  window.__endLiveAndClear = async () => {
    if (confirm("Live band karke is match ka data permanently delete karein? (PDF pehle download ho jayega)")) {
      try { generateMatchPDF(match); } catch (e) { /* still proceed with deletion even if PDF fails */ }
      await remove(ref(db, matchPath(realCode)));
      await remove(ref(db, adminPath(adminCode)));
      location.hash = "#/";
    }
  };

  function renderManagerBody(s) {
    if (s.realCode === null) {
      $app().innerHTML = `
        <div class="card center">
          <div class="eyebrow">Not Found</div>
          <p>Ye admin code invalid hai ya match already khatam ho chuka hai.</p>
          <a class="btn ghost" href="#/admin">← Wapas jao</a>
        </div>`;
      return;
    }
    if (s.realCode === undefined || !s.match) {
      $app().innerHTML = `<div class="card center">Match load ho raha hai...</div>`;
      return;
    }
    const m = s.match;
    const errorBanner = s.saveError ? `<div class="errorBanner">${esc(s.saveError)}</div>` : "";

    if (m.status === "openers1" || m.status === "openers2") {
      const battingTeamKey = m.currentInnings === 1 ? m.battingKey : m.bowlingKey;
      const players = m.config[battingTeamKey].players.filter((p) => !p.out);
      $app().innerHTML = `
        ${topBarHTML(m, { showAdminLink: true })}
        ${errorBanner}
        <div class="card overlapUp">
          <h3>Openers chuno — ${esc(m.config[battingTeamKey].name)}</h3>
          <label class="lbl">Striker</label>
          <select id="openerS" class="select">${players.map((p) => `<option value="${p.id}">${esc(p.name)}</option>`).join("")}</select>
          <label class="lbl">Non-striker</label>
          <select id="openerNS" class="select">${players.map((p, i) => `<option value="${p.id}" ${i === 1 ? "selected" : ""}>${esc(p.name)}</option>`).join("")}</select>
          <button class="btn primary big" onclick="window.__confirmOpeners()">Shuru Karo</button>
        </div>`;
      return;
    }

    if (m.status === "inningsBreak") {
      $app().innerHTML = `
        ${topBarHTML(m, { showAdminLink: true })}
        ${errorBanner}
        <div class="card center overlapUp">
          <div class="eyebrow">Innings Break</div>
          <div class="bigscore">${m.innings1.runs}/${m.innings1.wickets}</div>
          <p>${esc(m.config[m.battingKey].name)} ne ${fmtOvers(m.innings1.balls)} overs me ${m.innings1.runs} banaye.</p>
          <p class="target">${esc(m.config[m.bowlingKey].name)} ko jeetne ke liye chahiye: <b>${m.target}</b></p>
          <button class="btn primary big" onclick="window.__startSecondInnings()">Doosri Innings Shuru Karo</button>
        </div>`;
      return;
    }

    if (m.status === "completed") {
      $app().innerHTML = `
        ${topBarHTML(m, { showAdminLink: true })}
        ${errorBanner}
        <div class="card center printable overlapUp">
          <div class="eyebrow">Match Khatam</div>
          <h2>${esc(m.result)}</h2>
          <div class="summaryGrid">
            <div>
              <div class="teamName">${esc(m.config[m.battingKey].name)}</div>
              <div class="bigscore small">${m.innings1.runs}/${m.innings1.wickets} (${fmtOvers(m.innings1.balls)})</div>
            </div>
            <div>
              <div class="teamName">${esc(m.config[m.bowlingKey].name)}</div>
              <div class="bigscore small">${m.innings2.runs}/${m.innings2.wickets} (${fmtOvers(m.innings2.balls)})</div>
            </div>
          </div>
          <div class="noprint rowbtns">
            <button class="btn primary" onclick="window.__downloadPDF()">📄 PDF Download</button>
            <button class="btn danger" onclick="window.__endLiveAndClear()">End Live &amp; Save History</button>
          </div>
        </div>`;
      return;
    }

    const key = m.currentInnings === 1 ? "innings1" : "innings2";
    const teamKey = m.currentInnings === 1 ? m.battingKey : m.bowlingKey;
    const inn = m[key];

    $app().innerHTML = `
      ${topBarHTML(m, { showAdminLink: true })}
      ${errorBanner}
      <div class="stickyTop overlapUp">${renderScoreboardHTML(m, inn, teamKey)}</div>
      ${renderOverlayHTML(s.flash)}
      <div class="tabContent">
      ${s.activeTab === "score" ? `
      ${inn.freeHit ? `<div class="freehit">⚡ FREE HIT — sirf run out ho sakta hai</div>` : ""}
      <div class="keypad">
        <div class="grid6">
          ${[0, 1, 2, 3, 4, 6].map((r) => `<button class="ballbtn ${r === 4 ? "four" : r === 6 ? "six" : ""}" onclick="window.__doDelivery('normal',${r})">${r}</button>`).join("")}
        </div>
        <div class="grid4 extrasRow">
          <button class="chip ${s.extraMenu === "wide" ? "chipActive" : ""}" onclick="window.__toggleExtra('wide')">Wide</button>
          <button class="chip ${s.extraMenu === "noball" ? "chipActive" : ""}" onclick="window.__toggleExtra('noball')">No Ball</button>
          <button class="chip ${s.extraMenu === "bye" ? "chipActive" : ""}" onclick="window.__toggleExtra('bye')">Bye</button>
          <button class="chip ${s.extraMenu === "legbye" ? "chipActive" : ""}" onclick="window.__toggleExtra('legbye')">Leg Bye</button>
        </div>
        ${s.extraMenu ? `
          <div class="submenu">
            <span class="lbl">${s.extraMenu === "noball" ? "No ball — bat se kitne runs" : "Kitne runs"}</span>
            <div class="rowbtns">
              ${(s.extraMenu === "noball" ? [0, 1, 2, 3, 4, 6] : [0, 1, 2, 3, 4]).map((r) => `<button class="chip small" onclick="window.__doExtra('${s.extraMenu}',${r})">${r}</button>`).join("")}
            </div>
          </div>` : ""}
        <div class="rowbtns bigActionsRow">
          <button class="btn danger big" onclick="window.__openOut()">OUT</button>
          <button class="btn ghost big" onclick="window.__undo()" ${!s.history.length ? "disabled" : ""}>↩ Undo</button>
        </div>
      </div>` : ""}
      ${s.activeTab === "players" ? playerListHTML(m, teamKey, inn, { editable: true }) : ""}
      ${s.activeTab === "commentary" ? commentaryTabHTML(inn) : ""}
      ${s.activeTab === "info" ? infoTabHTML(m, { showAdmin: true }) : ""}
      </div>
      ${s.outOpen ? outModalHTML(m, teamKey, inn, s) : ""}
      ${tabBarHTML(s.activeTab)}
    `;
  }

  function benchPlayers(m, teamKey, inn) {
    return m.config[teamKey].players.filter((p) => !p.out && p.id !== inn.strikerId && p.id !== inn.nonStrikerId);
  }
  function outModalHTML(m, teamKey, inn, s) {
    const strikerName = m.config[teamKey].players.find((p) => p.id === inn.strikerId)?.name || "";
    const nonName = m.config[teamKey].players.find((p) => p.id === inn.nonStrikerId)?.name || "";
    const bench = benchPlayers(m, teamKey, inn);
    return `
      <div class="modalBg" onclick="if(event.target===this)window.__closeOut()">
        <div class="modal">
          <h3>Wicket Details</h3>
          <label class="lbl">Kaun out hua?</label>
          <div class="rowbtns">
            <button class="chip ${s.outSlot === "striker" ? "chipActive" : ""}" onclick="window.__setOutSlot('striker')">${esc(strikerName)} (striker)</button>
            <button class="chip ${s.outSlot === "non" ? "chipActive" : ""}" onclick="window.__setOutSlot('non')">${esc(nonName)} (non-striker)</button>
          </div>
          <label class="lbl">Kaise out hua</label>
          <select id="outHowSelect" class="select" onchange="window.__setOutHow(this.value)">
            ${["bowled", "caught", "run out", "stumped", "hit wicket"].map((v) => `<option value="${v}" ${s.outHow === v ? "selected" : ""}>${v[0].toUpperCase() + v.slice(1)}</option>`).join("")}
          </select>
          <label class="lbl">Out hone se pehle kitne run bhaage</label>
          <div class="rowbtns">
            ${[0, 1, 2, 3].map((r) => `<button class="chip small ${s.outRuns === r ? "chipActive" : ""}" onclick="window.__setOutRuns(${r})">${r}</button>`).join("")}
          </div>
          <label class="lbl">Naya batsman</label>
          <select id="newBatSelect" class="select" onchange="window.__setNewBat(this.value)">
            <option value="">-- chuno --</option>
            ${bench.map((p) => `<option value="${p.id}" ${s.newBatId === p.id ? "selected" : ""}>${esc(p.name)}</option>`).join("")}
            <option value="__new__" ${s.newBatId === "__new__" ? "selected" : ""}>+ Naya Player Add Karo</option>
          </select>
          ${s.newBatId === "__new__" ? `<input id="newBatNameInput" class="input" placeholder="Naye player ka naam" style="margin-top:8px;" autofocus />` : ""}
          <div class="rowbtns" style="margin-top:14px;">
            <button class="btn ghost" onclick="window.__closeOut()">Cancel</button>
            <button class="btn danger" onclick="window.__submitOut()">Confirm Out</button>
          </div>
        </div>
      </div>`;
  }

  render();
  const unsubAdmin = onValue(ref(db, adminPath(adminCode)), (snap) => { realCode = snap.val() || null; render();
    if (realCode) {
      const unsubMatch = onValue(ref(db, matchPath(realCode)), (snap2) => { setLocal(snap2.val()); });
      currentUnsubs.push(unsubMatch);
    }
  });
  currentUnsubs.push(unsubAdmin);
}

/* ============ Viewer view (read-only live) ============ */
function mountViewer(code) {
  let match = null, notFound = false, flash = null, flashTimer = null, lastEventId = null, activeTab = "score";

  function render() {
    if (notFound) {
      $app().innerHTML = `
        <div class="card center">
          <div class="eyebrow">Not Found</div>
          <p>Ye match live nahi hai ya khatam ho chuka hai. Code check karo.</p>
          <a class="btn ghost" href="#/watch">← Wapas jao</a>
        </div>`;
      return;
    }
    if (!match) { $app().innerHTML = `<div class="card center">Loading...</div>`; return; }

    if (["openers1", "openers2"].includes(match.status)) {
      $app().innerHTML = `
        ${viewerHeaderHTML(match.config.matchName)}
        <div class="card center overlapUp">
          <div class="eyebrow">Ruko...</div>
          <p>Manager openers select kar raha hai... ek second ruko.</p>
        </div>`;
      return;
    }
    if (match.status === "inningsBreak") {
      $app().innerHTML = `
        ${viewerHeaderHTML(match.config.matchName)}
        <div class="card center overlapUp">
          <div class="eyebrow">Innings Break</div>
          <div class="bigscore">${match.innings1.runs}/${match.innings1.wickets}</div>
          <p>${esc(match.config[match.battingKey].name)} — ${fmtOvers(match.innings1.balls)} overs</p>
          <p class="target">Target: ${match.target}</p>
        </div>`;
      return;
    }
    if (match.status === "completed") {
      $app().innerHTML = `
        ${viewerHeaderHTML(match.config.matchName, { live: false })}
        <div class="card center overlapUp">
          <div class="eyebrow">Match Khatam</div>
          <h2>${esc(match.result)}</h2>
          <div class="summaryGrid">
            <div>
              <div class="teamName">${esc(match.config[match.battingKey].name)}</div>
              <div class="bigscore small">${match.innings1.runs}/${match.innings1.wickets} (${fmtOvers(match.innings1.balls)})</div>
            </div>
            <div>
              <div class="teamName">${esc(match.config[match.bowlingKey].name)}</div>
              <div class="bigscore small">${match.innings2.runs}/${match.innings2.wickets} (${fmtOvers(match.innings2.balls)})</div>
            </div>
          </div>
        </div>`;
      return;
    }

    const teamKey = match.currentInnings === 1 ? match.battingKey : match.bowlingKey;
    const inn = match.currentInnings === 1 ? match.innings1 : match.innings2;

    $app().innerHTML = `
      ${viewerHeaderHTML(match.config.matchName)}
      <div class="stickyTop overlapUp">${renderScoreboardHTML(match, inn, teamKey)}</div>
      ${renderOverlayHTML(flash)}
      <div class="tabContent">
      ${activeTab === "score" || activeTab === "commentary" ? commentaryTabHTML(inn) : ""}
      ${activeTab === "players" ? playerListHTML(match, teamKey, inn) : ""}
      ${activeTab === "info" ? infoTabHTML(match) : ""}
      </div>
      ${tabBarHTML(activeTab)}
    `;
  }

  window.__setTab = (t) => { activeTab = t; render(); };

  const unsub = onValue(ref(db, matchPath(code)), (snap) => {
    const val = snap.val();
    if (val === null) { notFound = true; render(); return; }
    match = normalizeMatch(val);
    const inn = match.currentInnings === 1 ? match.innings1 : match.innings2;
    if (inn?.lastEvent && inn.lastEvent.id !== lastEventId) {
      lastEventId = inn.lastEvent.id;
      flash = inn.lastEvent;
      playEventSound(inn.lastEvent.kind);
      render();
      clearTimeout(flashTimer);
      flashTimer = setTimeout(() => { flash = null; render(); }, 1500);
      return;
    }
    render();
  });
  currentUnsubs.push(unsub);
  render();
}

mount();
</script>
